<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 370" width="420" height="370" role="img" aria-label="Illustration: a team working at dashboards">
  <!-- The artwork beside the E-Sarathi login form, redrawn flat from the live
       page: two panels of figures and numbers, the gears behind them, and three
       people on podiums. Mahindra Finance's red, the page's greys, nothing else. -->
  <title>A team working at dashboards</title>
  <defs>
    <clipPath id="panelA"><rect x="78" y="22" width="152" height="96" rx="6"/></clipPath>
    <clipPath id="panelB"><rect x="6" y="96" width="120" height="82" rx="6"/></clipPath>
  </defs>

  <!-- The pale disc everything is set against. -->
  <circle cx="232" cy="150" r="132" fill="#EDEEF0"/>

  <!-- Panel A: the dashboard the standing figure is presenting. -->
  <rect x="78" y="22" width="152" height="96" rx="6" fill="#55575C"/>
  <g clip-path="url(#panelA)">
    <g fill="#E6E7E9">
      <rect x="90" y="36" width="58" height="5" rx="2.5"/>
      <rect x="90" y="48" width="46" height="5" rx="2.5"/>
      <rect x="90" y="60" width="52" height="5" rx="2.5"/>
    </g>
    <g fill="none" stroke="#F3B9C2" stroke-width="3">
      <circle cx="171" cy="48" r="11"/><circle cx="196" cy="48" r="11"/><circle cx="221" cy="48" r="11"/>
    </g>
    <path d="M171 37a11 11 0 0 1 0 22z" fill="#E31837" opacity=".75"/>
    <path d="M196 37a11 11 0 0 1 9.5 16.5z" fill="#E31837" opacity=".75"/>
    <path d="M221 37a11 11 0 0 1 7.8 18.8z" fill="#E31837" opacity=".75"/>
    <g fill="#BFC3C8">
      <rect x="90" y="80" width="40" height="26" rx="3"/>
      <rect x="136" y="80" width="40" height="26" rx="3"/>
      <rect x="182" y="80" width="40" height="26" rx="3"/>
    </g>
  </g>

  <!-- Panel B: the same screen from the side, carrying a chart. -->
  <rect x="6" y="96" width="120" height="82" rx="6" fill="#55575C"/>
  <g clip-path="url(#panelB)">
    <g fill="#E6E7E9">
      <rect x="20" y="140" width="13" height="26"/><rect x="39" y="128" width="13" height="38"/>
      <rect x="77" y="134" width="13" height="32"/><rect x="96" y="118" width="13" height="48"/>
    </g>
    <rect x="58" y="112" width="13" height="54" fill="#E31837"/>
    <path d="M14 166h104" stroke="#9A9DA3" stroke-width="2"/>
  </g>
  <path d="M66 178v14M48 200l18-8 18 8" fill="none" stroke="#8C8F95" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The coins the numbers stand for. -->
  <g fill="#FBDCE1" stroke="#E31837" stroke-width="2.5">
    <circle cx="48" cy="60" r="17"/><circle cx="92" cy="98" r="14"/>
  </g>
  <g fill="#E31837" font-family="Georama, system-ui, sans-serif" font-weight="700" text-anchor="middle">
    <text x="48" y="67" font-size="20">$</text><text x="92" y="104" font-size="17">$</text>
  </g>

  <!-- The gears turning behind the screens: two drawn, one only outlined. -->
  <g transform="translate(262,156)">
    <g fill="#55575C">
      <circle r="34"/>
      <g id="teethBig">
        <rect x="-5.5" y="-42" width="11" height="12" rx="2"/>
      </g>
      <use href="#teethBig" transform="rotate(45)"/><use href="#teethBig" transform="rotate(90)"/>
      <use href="#teethBig" transform="rotate(135)"/><use href="#teethBig" transform="rotate(180)"/>
      <use href="#teethBig" transform="rotate(225)"/><use href="#teethBig" transform="rotate(270)"/>
      <use href="#teethBig" transform="rotate(315)"/>
    </g>
    <circle r="12" fill="#EDEEF0"/>
  </g>
  <g transform="translate(318,96)">
    <g fill="#8C8F95">
      <circle r="19"/>
      <g id="teethSmall"><rect x="-3.5" y="-25" width="7" height="8" rx="1.5"/></g>
      <use href="#teethSmall" transform="rotate(60)"/><use href="#teethSmall" transform="rotate(120)"/>
      <use href="#teethSmall" transform="rotate(180)"/><use href="#teethSmall" transform="rotate(240)"/>
      <use href="#teethSmall" transform="rotate(300)"/>
    </g>
    <circle r="7" fill="#EDEEF0"/>
  </g>
  <g transform="translate(332,44)" fill="none" stroke="#B4B7BC" stroke-width="2" stroke-dasharray="5 5">
    <circle r="16"/><circle r="26"/>
  </g>
  <g transform="translate(224,106)" fill="none" stroke="#B4B7BC" stroke-width="2" stroke-dasharray="5 5">
    <circle r="30"/>
  </g>

  <!-- The three podiums the figures work on. -->
  <rect x="14" y="268" width="104" height="82" rx="4" fill="#55575C"/>
  <rect x="132" y="240" width="112" height="110" rx="10" fill="#E31837"/>
  <rect x="258" y="268" width="104" height="82" rx="4" fill="#55575C"/>

  <!-- Left: a colleague at a laptop, on a stool. -->
  <g>
    <path d="M52 266v-14" stroke="#3F4145" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 268l10-16M64 268l-10-16" stroke="#3F4145" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="38" y="244" width="30" height="8" rx="4" fill="#3F4145"/>
    <path d="M62 236l26 4" stroke="#55575C" stroke-width="10" stroke-linecap="round"/>
    <path d="M50 244v-22" stroke="#8C8F95" stroke-width="18" stroke-linecap="round"/>
    <circle cx="52" cy="206" r="10" fill="#E3C9B6"/>
    <path d="M42 204a10 10 0 0 1 20 0 22 22 0 0 0-20 0z" fill="#3F4145"/>
    <path d="M60 218l20 14" stroke="#E3C9B6" stroke-width="6" stroke-linecap="round"/>
    <path d="M78 246h34l-8-22H86z" fill="#BFC3C8"/>
    <path d="M78 246h34" stroke="#8C8F95" stroke-width="3" stroke-linecap="round"/>
    <path d="M84 250v18M106 250v18" stroke="#8C8F95" stroke-width="3" stroke-linecap="round"/>
    <path d="M86 224h18l6 16H80z" fill="#EDEEF0"/>
  </g>

  <!-- Centre: the figure presenting, on the red podium. -->
  <g>
    <path d="M176 240v-34M192 240v-34" stroke="#3F4145" stroke-width="12" stroke-linecap="round"/>
    <rect x="164" y="156" width="40" height="56" rx="14" fill="#E31837"/>
    <path d="M200 166l16-20" stroke="#E31837" stroke-width="11" stroke-linecap="round"/>
    <circle cx="219" cy="142" r="6" fill="#E3C9B6"/>
    <path d="M168 168l-6 30" stroke="#E31837" stroke-width="11" stroke-linecap="round"/>
    <circle cx="161" cy="202" r="6" fill="#E3C9B6"/>
    <circle cx="184" cy="136" r="13" fill="#E3C9B6"/>
    <path d="M171 133a13 13 0 0 1 26 0 30 30 0 0 0-26 0z" fill="#3F4145"/>
  </g>

  <!-- Right: a colleague at a laptop, facing the other way. -->
  <g>
    <path d="M322 266v-14" stroke="#3F4145" stroke-width="4" stroke-linecap="round"/>
    <path d="M310 268l10-16M334 268l-10-16" stroke="#3F4145" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="306" y="244" width="30" height="8" rx="4" fill="#3F4145"/>
    <path d="M312 236l-26 4" stroke="#55575C" stroke-width="10" stroke-linecap="round"/>
    <path d="M322 244v-22" stroke="#E31837" stroke-width="18" stroke-linecap="round"/>
    <circle cx="320" cy="206" r="10" fill="#E3C9B6"/>
    <path d="M310 204a10 10 0 0 1 20 0 22 22 0 0 0-20 0z" fill="#3F4145"/>
    <path d="M332 200c8 2 8 12 4 18" stroke="#3F4145" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M312 218l-20 14" stroke="#E3C9B6" stroke-width="6" stroke-linecap="round"/>
    <path d="M262 246h34l-8-22h-18z" fill="#BFC3C8"/>
    <path d="M262 246h34" stroke="#8C8F95" stroke-width="3" stroke-linecap="round"/>
    <path d="M268 250v18M290 250v18" stroke="#8C8F95" stroke-width="3" stroke-linecap="round"/>
    <path d="M272 224h18l6 16h-30z" fill="#EDEEF0"/>
  </g>
</svg>
