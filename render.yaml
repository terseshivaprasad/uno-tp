services:
  - type: web
    name: uno-tp
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Addresses of the other eSarathi apps (see AppUrls.cs). Until they are
      # deployed, links out to the login and the console stay plain paths.
      # - key: Apps__eSarathiLogin
      #   value: https://<login-service>.onrender.com
      # - key: Apps__eSarathiConsole
      #   value: https://<console-service>.onrender.com
      # The database all data is kept in (db/ has the scripts), and the one gateway
      # every backend API is behind (see UnoTP/Services/BackendOptions.cs). The app
      # does not start until both are set.
      # - key: ConnectionStrings__UnoTP
      #   value: Server=<sql-host>;Database=UnoTP;User Id=<user>;Password=<secret>;Encrypt=True
      # - key: Backend__BaseUrl
      #   value: https://<gateway-host>/
