services:
  - type: web
    name: uno-tp
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Demo mode is off in Production: no sign-in without the portal's UserId and
      # Syscode, no test data cards, and no ?ff= or ?agency= overrides. For a demo
      # deployment, turn it on here - never on one that reaches a real backend.
      # - key: Features__DemoData
      #   value: "true"
      # - key: Entry__DemoUserId
      #   value: "100002225"
      # - key: Entry__DemoSysCode
      #   value: UNOTP
      # - key: Features__AllowOverrides
      #   value: "true"
      # Addresses of the other eSarathi apps (see AppUrls.cs). Until they are
      # deployed, links out to the login, console and explorers stay plain paths.
      # - key: Apps__eSarathiLogin
      #   value: https://<login-service>.onrender.com
      # - key: Apps__eSarathiConsole
      #   value: https://<console-service>.onrender.com
      # - key: Apps__DmsExplorer
      #   value: https://<dms-service>.onrender.com
      # - key: Apps__OvdExplorer
      #   value: https://<ovd-service>.onrender.com
      # The backend API all data comes from (see UnoTP.Backend/BackendOptions.cs),
      # and Idfy.Api for the document checks. Left out, the app runs on the mock.
      # - key: Backend__BaseUrl
      #   value: https://<backend-service>
      # - key: Idfy__BaseUrl
      #   value: https://<idfy-api-host>
