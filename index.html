<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uno TP screens</title>
<style>
  :root { --bg: #f3f5f8; --card: #fff; --ink: #1b2330; --muted: #5d6878; --line: #dfe4ec; --accent: #c8102e; --accent-bg: #fdecef; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: grid; grid-template-columns: 300px 1fr; }
  nav { background: var(--card); border-right: 1px solid var(--line); overflow-y: auto; height: 100vh; position: sticky; top: 0; }
  nav h1 { font-size: 15px; margin: 0; padding: 16px 16px 4px; }
  nav p { margin: 0; padding: 0 16px 12px; color: var(--muted); font-size: 12px; }
  nav h2 { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 14px 16px 6px; border-top: 1px solid var(--line); }
  nav button { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; background: none; font: inherit; color: inherit; padding: 7px 16px; cursor: pointer; }
  nav button:hover { background: var(--bg); }
  nav button[aria-current="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  nav button span:first-child { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 20px; }
  main { min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header .where { flex: 1; min-width: 240px; }
  header .where small { display: block; color: var(--muted); font-size: 12px; }
  header .where strong { font-size: 15px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button, .nav-btn { border: 0; background: var(--card); font: inherit; padding: 8px 14px; cursor: pointer; color: inherit; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .nav-btn { border: 1px solid var(--line); border-radius: 8px; }
  .nav-btn:disabled { opacity: .4; cursor: default; }
  .stage { flex: 1; overflow: auto; padding: 20px; text-align: center; }
  .stage img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 6px 20px rgba(16, 24, 40, .08); }
  .stage.is-mobile img { max-width: 390px; }
  .stage .none { color: var(--muted); padding: 60px 0; }
  .menu { display: none; }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; }
    nav { position: fixed; inset: 0 auto 0 0; width: 86vw; max-width: 320px; z-index: 5; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0, 0, 0, .25); }
    nav.is-open { transform: none; }
    .menu { display: inline-block; }
    header { padding: 10px 12px; }
    .stage { padding: 12px; }
  }
</style>
</head>
<body>
<nav id="list" aria-label="Steps">
  <h1>Uno TP screens</h1>
  <p>Every page and case, in order. Dev data only.</p>
</nav>
<main>
  <header>
    <button class="nav-btn menu" id="menu" type="button">Steps</button>
    <div class="where"><small id="count"></small><strong id="note"></strong></div>
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="asDesktop" aria-pressed="true">Desktop</button>
      <button type="button" id="asMobile" aria-pressed="false">Mobile</button>
    </div>
    <button class="nav-btn" id="prev" type="button">&larr; Previous</button>
    <button class="nav-btn" id="next" type="button">Next &rarr;</button>
  </header>
  <div class="stage" id="stage"></div>
</main>

p": 110, "group": "E-Sarathi Console", "note": "Something went wrong: the error page, with a reference for support", "desktop": "desktop/110-console-error.png", "mobile": "mobile/110-console-error.png"}, {"step": 111, "group": "E-Sarathi Console", "note": "After Logout, or with no session: Session Expired, and the way back to the login", "desktop": "desktop/111-console-session-expired.png", "mobile": "mobile/111-console-session-expired.png"}];
var at = 0, view = 'desktop';
var list = document.getElementById('list'), stage = document.getElementById('stage');
var buttons = [];
var lastGroup = '';
steps.forEach(function (s, i) {
  if (s.group !== lastGroup) { var h = document.createElement('h2'); h.textContent = s.group; list.appendChild(h); lastGroup = s.group; }
  var b = document.createElement('button'); b.type = 'button';
  var num = document.createElement('span'); num.textContent = s.step;
  var text = document.createElement('span'); text.textContent = s.note;
  b.appendChild(num); b.appendChild(text);
  b.addEventListener('click', function () { show(i); list.classList.remove('is-open'); });
  list.appendChild(b); buttons.push(b);
});
function show(i) {
  at = Math.max(0, Math.min(steps.length - 1, i));
  var s = steps[at];
  document.getElementById('count').textContent = 'Step ' + s.step + ' of ' + steps.length + ' · ' + s.group;
  document.getElementById('note').textContent = s.note;
  stage.className = 'stage' + (view === 'mobile' ? ' is-mobile' : '');
  stage.textContent = '';
  var src = s[view];
  if (src) {
    var a = document.createElement('a'); a.href = src; a.target = '_blank'; a.title = 'Open the picture at full size';
    var img = document.createElement('img'); img.src = src; img.alt = s.note;
    a.appendChild(img); stage.appendChild(a);
  } else { var none = document.createElement('p'); none.className = 'none'; none.textContent = 'No picture of this step in this view.'; stage.appendChild(none); }
  stage.scrollTop = 0;
  buttons.forEach(function (b, n) { b.setAttribute('aria-current', n === at ? 'true' : 'false'); });
  buttons[at].scrollIntoView({ block: 'nearest' });
  document.getElementById('prev').disabled = at === 0;
  document.getElementById('next').disabled = at === steps.length - 1;
  try { history.replaceState(null, '', '#' + s.step + (view === 'mobile' ? '-mobile' : '')); } catch (e) {}
}
function setView(v) {
  view = v;
  document.getElementById('asDesktop').setAttribute('aria-pressed', v === 'desktop');
  document.getElementById('asMobile').setAttribute('aria-pressed', v === 'mobile');
  show(at);
}
document.getElementById('prev').addEventListener('click', function () { show(at - 1); });
document.getElementById('next').addEventListener('click', function () { show(at + 1); });
document.getElementById('asDesktop').addEventListener('click', function () { setView('desktop'); });
document.getElementById('asMobile').addEventListener('click', function () { setView('mobile'); });
document.getElementById('menu').addEventListener('click', function () { list.classList.toggle('is-open'); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') show(at + 1);
  if (e.key === 'ArrowLeft') show(at - 1);
  if (e.key === 'd') setView('desktop');
  if (e.key === 'm') setView('mobile');
});
var start = (location.hash || '').replace('#', '').split('-');
if (start[1] === 'mobile') view = 'mobile';
setView(view);
show(Math.max(0, (parseInt(start[0], 10) || 1) - 1));
</script>
